[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 10000
ffi = false
via_ir = true
# Reproducible runtime code (expected codehashes, scripts/expected-codehashes.mjs): no metadata
# hash and no CBOR trailer, so the code depends only on source, settings, immutables and links.
bytecode_hash = "none"
cbor_metadata = false
# Artifacts carry the AST, which expected-codehashes.mjs reads to name immutableReferences.
ast = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../setup" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 50
