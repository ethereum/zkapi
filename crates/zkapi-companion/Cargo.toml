[package]
name = "zkapi-companion"
description = "zkapi-walletd: the zkAPI wallet and prover companion that zkapi-clientd runs"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "zkapi-walletd"
path = "src/main.rs"

[dependencies]
zkapi-client = { path = "../../protocol/rust/crates/zkapi-client" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-auth = { path = "../zkapi-auth" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
fs2 = { workspace = true }
futures-util = "0.3"
rayon = "1.11"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
sha2 = "0.10"
ring = "0.17.14"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The tests prove with the committed development setup
# (protocol/setup/v2-concession-dev), which only a `dev-setup` build loads.
# Dev-dependency features never reach `cargo build -p zkapi-companion`.
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof", features = ["dev-setup"] }
http-body-util = "0.1"
tempfile = { workspace = true }
