[package]
name = "zkapi-cli"
description = "Command-line interface for the zkAPI app-layer workspace"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "zkapi"
path = "src/main.rs"

[dependencies]
zkapi-serverd = { path = "../zkapi-serverd" }
zkapi-indexerd = { path = "../zkapi-indexerd" }
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Drill and acceptance builds only: `zkapi --adversary <mode> serverd`. A
# release build has no such flag (tests/release_rejects_adversary.rs).
adversary = ["zkapi-serverd/adversary"]

[dev-dependencies]
# Tests load the development setup (protocol/setup/v2-concession-dev); a
# release build never accepts it.
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof", features = ["dev-setup"] }
