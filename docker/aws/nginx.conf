worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
# The forwarded-source pattern below is anchored and runs in linear time; JIT
# only makes it cheaper. Without JIT support nginx warns and interprets it.
pcre_jit on;
events { worker_connections 1024; }
http {
    # Avoid recording note IDs, nullifiers, client request IDs or query strings.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Coarse per-source flood ceilings for POSTs that verify proofs or create
    # state. They are not per-user quotas: browser hosts reach this origin
    # through one same-origin rewrite egress, so one source carries all of a
    # host's users. Size each rate and burst for a host's aggregate peak.
    #
    # Behind CloudFront the TCP peer is an edge node, and CloudFront appends the
    # address it received the request from as the last X-Forwarded-For element.
    # That element names the source only while the origin accepts traffic from
    # CloudFront alone (see README.md). Without a usable header the TCP peer is
    # the source. The pattern is anchored, so a long hostile header costs linear
    # time, and it accepts only a short address-shaped element.
    map $http_x_forwarded_for $zkapi_source {
        default $remote_addr;
        "~^(?:.*[, ])?(?<zkapi_forwarded_source>[0-9A-Fa-f:.]{2,45}) *$" $zkapi_forwarded_source;
    }
    # Only POSTs are counted: nginx does not account requests with an empty key.
    map $request_method $zkapi_post_source {
        default "";
        POST $zkapi_source;
    }
    limit_req_zone $zkapi_post_source zone=zkapi_clearance:10m rate=10r/s;
    limit_req_zone $zkapi_post_source zone=zkapi_lease:10m rate=20r/s;
    limit_req_zone $zkapi_post_source zone=zkapi_v2_post:10m rate=20r/s;
    limit_req_status 429;
    # Below error_log's level, so throttling never logs an address or request line.
    limit_req_log_level info;

    # Throttled requests are logged with their status and limit zone only.
    map $uri $zkapi_limit_zone {
        default zkapi_v2_post;
        /v2/withdraw/clearance zkapi_clearance;
        /v2/openrouter/leases zkapi_lease;
    }
    log_format zkapi_throttled escape=json '{"event":"gateway_rate_limited","status":$status,"zone":"$zkapi_limit_zone"}';

    server {
        listen 8080;
        # Resolve Docker service addresses again after a service is recreated.
        set $server_upstream http://server:3000;
        set $indexer_upstream http://indexer:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        # Applies only to responses nginx generates: the API's own errors,
        # including its 429s, pass through unchanged.
        error_page 429 @zkapi_rate_limited;

        location = /health { proxy_pass $server_upstream; }
        location = /v1/attestation { proxy_pass $server_upstream; }
        location = /v2/withdraw/clearance {
            limit_req zone=zkapi_clearance burst=100 nodelay;
            proxy_pass $server_upstream;
        }
        location = /v2/openrouter/leases {
            limit_req zone=zkapi_lease burst=200 nodelay;
            proxy_pass $server_upstream;
        }
        location /v2/ {
            limit_req zone=zkapi_v2_post burst=200 nodelay;
            proxy_pass $server_upstream;
        }
        location /v1/tree/ { proxy_pass $indexer_upstream; }
        location = /config.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/request.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/withdrawal.pk {
            root /srv/zkapi;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /proofs/manifest.json {
            root /srv/zkapi;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        # The request never reached the API: the same request is safe to retry.
        location @zkapi_rate_limited {
            access_log /dev/stdout zkapi_throttled;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            add_header Access-Control-Allow-Origin "*" always;
            return 429 '{"status":"error","client_request_id":"","error_code":"gateway_rate_limited","error_message":"Too many requests from this network source; retry the same request later.","retriable":true,"retry_after_seconds":5}';
        }
        # Includes the decoded operator dashboard and every unknown route.
        location / { return 404; }
    }
}
