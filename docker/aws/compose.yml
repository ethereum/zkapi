name: zkapi

x-daemon: &daemon
  image: zkapi/aws:${ZKAPI_IMAGE_TAG:-concession-v1}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
    # 1 builds a single-party image (README.md, "Single-party setup"); the
    # gateway takes the same value.
    args:
      ALLOW_DEV_SETUP: ${ALLOW_DEV_SETUP:-}
  entrypoint: ["zkapi-run"]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
  volumes:
    - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  indexer:
    <<: *daemon
    command: ["indexer"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/indexer.env
    healthcheck:
      # 200 only while a verified view is served. The start period covers a full
      # replay from DEPLOY_BLOCK (first start of a new checkpoint, or a resync);
      # health turns 200 as soon as the replay verifies against the vault.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 900s

  # Creates or migrates /data/server.db and binds it to the deployment
  # manifest, before the challenger and the server start (order: indexer,
  # db-init, challenger, server).
  db-init:
    <<: *daemon
    command: ["db-init"]
    restart: "no"
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
    volumes:
      - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
      - &manifest
        type: bind
        source: ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.json
        target: /srv/zkapi/deployment.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      indexer:
        condition: service_started

  server:
    <<: *daemon
    command: ["server"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/server.env
    volumes:
      - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
      - *manifest
    depends_on:
      # Not service_healthy: a stale, diverged or replaying indexer answers 503,
      # which the server tolerates; it must not keep the API down.
      indexer:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 6s
      retries: 3
      # Covers the startup vault signing-key check and its RPC retries.
      start_period: 120s

  challenger:
    <<: *daemon
    profiles: ["challenge"]
    command: ["challenger"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/deployment.env
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/challenge.env
    volumes:
      - ${ZKAPI_DATA_DIR:-/var/lib/zkapi}:/data
      - *manifest
    depends_on:
      # The challenger opens the server database read-only: `zkapi db init`
      # created it and its deployment binding. An unhealthy API or indexer
      # must never keep it down.
      db-init:
        condition: service_completed_successfully
      signer:
        condition: service_healthy
    healthcheck:
      # Liveness of the poll loop only. /health returns 503 for alarms (a
      # missed deadline, a diverged indexer) and is for alerting, not restarts.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3002/livez"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 60s

  signer:
    image: zkapi/signer:${ZKAPI_IMAGE_TAG:-concession-v1}
    build:
      context: ./signer
    profiles: ["challenge"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    env_file:
      - ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/signer.env
    environment:
      ZKAPI_CHALLENGE_LISTEN_HOST: 0.0.0.0
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:8547/health', {signal: AbortSignal.timeout(5000)}); if (!r.ok) process.exit(1);"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  gateway:
    image: zkapi/gateway:${ZKAPI_IMAGE_TAG:-concession-v1}
    build:
      context: ../..
      dockerfile: docker/aws/Dockerfile.gateway
      args:
        ALLOW_DEV_SETUP: ${ALLOW_DEV_SETUP:-}
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    volumes:
      - type: bind
        source: ${ZKAPI_CONFIG_DIR:-/etc/zkapi}/config.json
        target: /srv/zkapi/config.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${ZKAPI_HTTP_BIND:-127.0.0.1}:${ZKAPI_HTTP_PORT:-8080}:8080
    networks: [backend]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  # No daemon port is published. Egress is needed for chain/provider RPCs.
  backend:
    driver: bridge
