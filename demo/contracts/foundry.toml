# The vault links no library: script/Deploy.s.sol deploys the Poseidon runtime from its
# artifact and passes its address to the vault. Create the output directory first
# (fs_permissions does not admit a missing directory):
#   mkdir -p ../../.demo
#   OUTPUT_PATH="$PWD/../../.demo/deployment.json" ... forge script script/Deploy.s.sol
# Poseidon uses the same separately pinned legacy profile as protocol/contracts.
# Deploy imports the paymaster, so its core deployment compilation unit joins the
# 200-run profile below. Use these artifacts for finalization and runtime codehash checks.
[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["../../protocol/contracts/lib", "../../protocol/contracts/src"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 10000
ffi = false
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ast = true
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../../protocol/setup" },
    { access = "read-write", path = "../../.demo" },
]
# Bn254PoseidonRuntime is compiled with the legacy pipeline, as in protocol/contracts;
# script/PoseidonRuntimeArtifact.sol imports it (and so joins the profile) to get it into out/.
# The dual-schedule paymaster uses 200 optimizer runs to remain below EIP-170.
# Its importers and dependencies, including Deploy and the core deployed contracts,
# join the same profile. Poseidon remains in its separate legacy compilation unit.
additional_compiler_profiles = [{ name = "legacy", via_ir = false }, { name = "gasless", optimizer_runs = 200 }]
compilation_restrictions = [
    { paths = "../../protocol/contracts/src/gasless/ZkApiWithdrawalPaymaster.sol", optimizer_runs = 200 },
    { paths = "../../protocol/contracts/src/poseidon/Bn254PoseidonRuntime.sol", via_ir = false },
    { paths = "script/PoseidonRuntimeArtifact.sol", via_ir = false },
]
