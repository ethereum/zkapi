name: zkAPI client daemon installer
on:
  pull_request:
    paths:
      - 'zkapi-clientd/install.sh'
      - 'zkapi-clientd/scripts/**'
      - 'zkapi-clientd/packaging/**'
      - '.github/workflows/zkapi-clientd-install.yml'
      - '.github/workflows/zkapi-clientd-release.yml'
      - '.github/workflows/zkapi-clientd-publish.yml'
  push:
    paths:
      - 'zkapi-clientd/install.sh'
      - 'zkapi-clientd/scripts/**'
      - 'zkapi-clientd/packaging/**'
      - '.github/workflows/zkapi-clientd-install.yml'
      - '.github/workflows/zkapi-clientd-release.yml'
      - '.github/workflows/zkapi-clientd-publish.yml'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n zkapi-clientd/install.sh
      - name: Test installer with local release fixtures
        run: python3 zkapi-clientd/scripts/test-install.py
      - name: Test package generation and source preparation
        run: |
          python3 zkapi-clientd/scripts/sync-packages.py --check
          python3 zkapi-clientd/scripts/test-packages.py
          python3 zkapi-clientd/scripts/test-package-publication.py
          python3 zkapi-clientd/scripts/test-prepare-zkapi.py
          python3 zkapi-clientd/scripts/test-source-install.py
